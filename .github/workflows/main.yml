name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v5
    - run: mise run setup
    - parallel:
        - name: Lint
          run: mise run lint
        - name: Test
          run: mise run test
    - name: Checks completed
      run: echo 'Both checks passed'
