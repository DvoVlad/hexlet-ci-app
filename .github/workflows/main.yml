name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  parallel-demo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v5
    - run: mise run setup
    - name: Test
      id: tests
      background: true
      run: mise run test
    - name: Lint
      run: mise run lint
    - name: Wait for tests
      wait: tests
    - name: Wait for remaining work
      wait-all:
