name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  CHECK_LABEL: training
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  timeout-minutes: 15
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - run: mise run lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            label: baseline
          - os: ubuntu-26.04
            label: current
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: dependencies
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run setup
      - name: Show cache result
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: printf 'Exact cache hit = %s\n' "$CACHE_HIT"
      - run: mise run test
      - name: Tests are failing
        if: ${{ failure() }}
        run: echo 'Tests fail now!'
      - name: Save test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-report-${{ matrix.os }}
          path: reports/test-results.xml
          retention-days: 7
          if-no-files-found: error
  inspect-report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: test-report-*
          path: received-report
      - name: Check both reports
        run: |
          test -s received-report/test-report-ubuntu-24.04/test-results.xml
          test -s received-report/test-report-ubuntu-26.04/test-results.xml
  verify:
    name: CI result
    needs: [lint, test]
    runs-on: ubuntu-26.04
    steps:
      - run: echo "All checks passed"
  inspect:
    runs-on: ubuntu-26.04
    steps:
      - name: Show workflow values
        run: |
          printf '%s\n' "$CHECK_LABEL"
          printf '%s\n' "$GITHUB_WORKFLOW"
      - name: Show step value
        env:
          CHECK_LABEL: local-step
        run: printf '%s\n' "$CHECK_LABEL"
      - name: Show workflow value again
        run: printf '%s\n' "$CHECK_LABEL"
      - name: Manual run information
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo 'This step was requested manually'
      - name: Show run information
        env:
          LABEL: ${{ vars.CI_LABEL || 'training' }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: printf '%s\n' "$LABEL" "$EVENT_NAME" "$WORKFLOW_NAME"
  work_secrects:
    runs-on: ubuntu-26.04
    steps:
      - name: Check training secret
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TRAINING_SECRET: ${{ secrets.TRAINING_SECRET }}
        run: |
          test -n "$TRAINING_SECRET"
          echo 'Training secret is available'
      - name: Read repository information
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq .full_name
