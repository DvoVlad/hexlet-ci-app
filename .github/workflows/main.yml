name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  parallel-demo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: jdx/mise-action@v5.2.10
    - run: mise run setup
    - parallel:
        - name: Lint
          run: mise run lint
        - name: Test
          run: mise run test
    - name: Checks completed
      run: echo 'Both checks passed'
